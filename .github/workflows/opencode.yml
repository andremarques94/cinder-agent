name: OpenCode

on:
  issue_comment: # zizmor: ignore[dangerous-triggers] trusted association and same-repository checks below
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_run: # zizmor: ignore[dangerous-triggers] validated Dependabot identity and head before checkout
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: opencode-${{ github.event.workflow_run.id || github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  comment:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null ||
       github.event_name == 'pull_request_review_comment') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run OpenCode
        uses: ./.github/actions/opencode-v2 # zizmor: ignore[self-repository] trusted commit checked out above
        with:
          commit-message: "fix: apply OpenCode changes"
          github-token: ${{ github.token }}
          oidc-client-id: ${{ vars.OPENCODE_OIDC_CLIENT_ID }}
          pr-number: ${{ github.event.issue.number || github.event.pull_request.number }}
          prompt: comment
          request: ${{ github.event.comment.body }}

  dependabot-review:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    outputs:
      head-ref: ${{ steps.review.outputs.head-ref }}
      head-sha: ${{ steps.review.outputs.head-sha }}
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Review Dependabot update
        id: review
        uses: ./.github/actions/opencode-v2 # zizmor: ignore[self-repository] trusted commit checked out above
        with:
          commit-message: "build(deps): apply OpenCode compatibility fixes"
          expected-author: dependabot[bot]
          github-token: ${{ github.token }}
          head-ref-prefix: dependabot/
          oidc-client-id: ${{ vars.OPENCODE_OIDC_CLIENT_ID }}
          pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          prompt: dependabot
          require-ready: "true"

  dependabot-ci:
    needs: dependabot-review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Dispatch and wait for CI
        env:
          EXPECTED_HEAD_SHA: ${{ needs.dependabot-review.outputs.head-sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ needs.dependabot-review.outputs.head-ref }}
        run: bash .github/scripts/dispatch-ci.sh

  dependabot-merge:
    needs: [dependabot-review, dependabot-ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Merge unchanged verified head
        env:
          EXPECTED_HEAD_SHA: ${{ needs.dependabot-review.outputs.head-sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_URL: https://github.com/${{ github.repository }}/pull/${{ github.event.workflow_run.pull_requests[0].number }}
        run: bash .github/scripts/merge-verified-pr.sh
