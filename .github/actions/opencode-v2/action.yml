name: Run OpenCode V2 on a pull request
description: Validate a PR, run restricted OpenCode V2, commit repairs, and post its report

inputs:
  api-key: { description: OpenCode provider API key, required: true }
  commit-message: { description: Commit message used when OpenCode edits files, required: true }
  expected-author: { description: Required PR author, required: false, default: "" }
  github-token: { description: GitHub token used outside OpenCode, required: true }
  head-ref-prefix: { description: Required PR branch prefix, required: false, default: "" }
  model: { description: OpenCode model ID, required: false, default: opencode-go/kimi-k3 }
  pr-number: { description: Pull request number, required: true }
  prompt: { description: Prompt template name, required: true }
  request: { description: Trusted request appended to the prompt, required: false, default: "" }
  require-ready: { description: Reject draft pull requests, required: false, default: "false" }
  sha256:
    description: SHA-256 of the pinned Linux x64 archive
    required: false
    default: 89a6cee227b54bc011179c528a5e63176032462b1a5e21723b616801cddc2ca7
  version: { description: Exact OpenCode CLI version, required: false, default: 2.2.7 }

outputs:
  head-ref: { description: Validated PR branch, value: "${{ steps.pr.outputs.ref }}" }
  head-sha:
    { description: PR head after any OpenCode commit, value: "${{ steps.head.outputs.sha }}" }

runs:
  using: composite
  steps:
    - name: Validate pull request
      id: pr
      shell: bash
      env:
        EXPECTED_AUTHOR: ${{ inputs.expected-author }}
        GH_TOKEN: ${{ inputs.github-token }}
        HEAD_REF_PREFIX: ${{ inputs.head-ref-prefix }}
        PR_NUMBER: ${{ inputs.pr-number }}
        REQUIRE_READY: ${{ inputs.require-ready }}
      run: bash "${GITHUB_ACTION_PATH}/validate-pr.sh"

    - name: Checkout pull request
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ steps.pr.outputs.ref }}
        path: pr
        persist-credentials: false
        token: ${{ inputs.github-token }}

    - name: Verify checked-out head
      shell: bash
      working-directory: pr
      env:
        EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.sha }}
      run: test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

    - name: Reject symlinks
      shell: bash
      working-directory: pr
      run: |
        if find . -type l -print -quit | grep -q .; then
          echo "Pull requests containing symlinks are not eligible for OpenCode automation." >&2
          exit 1
        fi

    - name: Install pinned OpenCode V2
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        GH_TOKEN: ""
        OPENCODE_API_KEY: ""
        OPENCODE_SHA256: ${{ inputs.sha256 }}
        OPENCODE_VERSION: ${{ inputs.version }}
      run: |
        install_dir="${RUNNER_TEMP}/opencode-cli/${OPENCODE_VERSION}"
        archive="${RUNNER_TEMP}/opencode-${OPENCODE_VERSION}.tar.gz"
        mkdir -p "${install_dir}"
        curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz" -o "${archive}"
        printf '%s  %s\n' "${OPENCODE_SHA256}" "${archive}" | sha256sum --check --status
        tar -xzf "${archive}" -C "${install_dir}"
        "${install_dir}/opencode" --version

    - name: Run restricted OpenCode V2
      shell: bash
      env:
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_PROMPT_NAME: ${{ inputs.prompt }}
        INPUT_REQUEST: ${{ inputs.request }}
        INPUT_WORKING_DIRECTORY: ${{ github.workspace }}/pr
        OPENCODE_API_KEY: ${{ inputs.api-key }}
        OPENCODE_BIN: ${{ runner.temp }}/opencode-cli/${{ inputs.version }}/opencode
        REPORT_FILE: ${{ runner.temp }}/opencode-report.md
      run: bash "${GITHUB_ACTION_PATH}/run.sh"

    - name: Commit and push changes
      shell: bash
      working-directory: pr
      env:
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        GH_TOKEN: ${{ inputs.github-token }}
        HEAD_REF: ${{ steps.pr.outputs.ref }}
      run: bash "${GITHUB_ACTION_PATH}/commit-changes.sh"

    - name: Record reviewed head
      id: head
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
        [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
        echo "sha=${head_sha}" >> "${GITHUB_OUTPUT}"

    - name: Post OpenCode report
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        REPORT_FILE: ${{ runner.temp }}/opencode-report.md
      run: gh pr comment "${PR_NUMBER}" --body-file "${REPORT_FILE}"
