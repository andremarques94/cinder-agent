packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@commitlint/cli": 21.2.4
  "@commitlint/config-conventional": 21.2.4
  "@opencode/client": 2.2.7
  hono: 4.13.17
  valibot: 1.5.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vite-plus: 1.5.1
  wrangler: 4.158.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - "@opencode/client@2.2.7"
  - "@opencode/protocol@2.2.7"
  - "@opencode/schema@2.2.7"
