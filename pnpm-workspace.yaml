packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@cloudflare/sandbox": 1.0.3
  "@commitlint/cli": 21.2.4
  "@commitlint/config-conventional": 21.2.4
  "@opencode/client": 2.2.7
  hono: 4.13.17
  valibot: 1.5.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vite-plus: 1.5.1
  wrangler: 4.158.0
  "@octokit/auth-app": 8.3.1
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  knip: 6.44.2
  uqr: 0.1.3
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - "@opencode/client@2.2.7"
  - "@opencode/protocol@2.2.7"
  - "@opencode/schema@2.2.7"
